# Conventional-QSAR stack for the CYP-Challenge activity track.
#
# Versions are those verified working in the host `chemprop` conda env on
# 2026-10-25, with ONE deliberate change: python is pinned to 3.12 rather than
# 3.14. Mordred's multiprocessing goes through forkserver and dies under 3.14
# with ConnectionResetError (see the note in lgbm_cyp3a4_single.py::mordred_block),
# which forces nproc=1 and turns a minutes-long descriptor pass into an hour.
# 3.12 restores the parallel path; the selftest asserts it actually works.
#
# openjdk is here because PaDEL-Descriptor is a java jar that padelpy shells out
# to. Without a JRE every fingerprint type fails at run time, not build time.
name: cypqsar
channels:
  - conda-forge
dependencies:
  - python=3.12.*
  - openjdk=25.*

  # cheminformatics
  - rdkit=2026.03.*
  - mordredcommunity=2.0.7
  - padelpy=0.1.16

  # learners
  - scikit-learn=1.8.*
  - lightgbm=4.7.*
  - optuna=4.9.*

  # data
  - numpy=2.2.*
  - pandas=2.3.*
  - scipy=1.*
  - pyarrow=25.*
  - joblib=1.*
  - networkx=3.*
  - tqdm
